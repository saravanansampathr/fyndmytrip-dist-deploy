<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1c66" />

    <!--
      Site-wide fallback SEO tags — the very first thing a crawler, a shared
      link preview, or a browser tab sees before the SPA has hydrated.
      HomePage and each vertical's search page (Flights/Hotels/Buses/...)
      override title + description per-route via useDocumentTitle once
      mounted — see src/hooks/useDocumentTitle.ts's docblock for why this
      exists as a real gap: every route used to inherit this same generic
      tag, which is not how MakeMyTrip/Goibibo/Cleartrip/EaseMyTrip do it.
    -->
    <title>FyndMyTrip — Flights, Hotels, Buses & Holiday Packages Booking</title>
    <meta
      name="description"
      content="Book domestic & international flights, hotels, bus tickets, cabs, holiday packages, cruises, activities, travel insurance and visa services on FyndMyTrip — transparent pricing, secure checkout, 24/7 support."
    />
    <meta name="keywords" content="flight booking, hotel booking, bus tickets, holiday packages, cab booking, travel insurance, visa assistance, FyndMyTrip" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FyndMyTrip" />
    <meta property="og:title" content="FyndMyTrip — Flights, Hotels, Buses & Holiday Packages Booking" />
    <meta
      property="og:description"
      content="Compare live fares and book flights, hotels, buses, cabs, holiday packages, cruises, activities, insurance and visa — all from one account."
    />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FyndMyTrip — Flights, Hotels, Buses & Holiday Packages Booking" />
    <meta
      name="twitter:description"
      content="Compare live fares and book flights, hotels, buses, cabs, holiday packages, cruises, activities, insurance and visa — all from one account."
    />

    <script>
      // Structured data (schema.org Organization + WebSite/SearchAction) so
      // search engines can show a sitelinks search box and attribute pages
      // to the FyndMyTrip brand. Built from window.location.origin rather
      // than a hard-coded domain, since this same build is served from more
      // than one hostname (demo.fyndmytrip.in today, possibly a different
      // production domain later) — this way the markup is always correct
      // for whichever host actually served the page, with no deploy-time
      // config needed. The SearchAction target is a real, working URL
      // (PackagesPage reads its `q` query param — see that page's
      // useSearchParams initialization).
      (function () {
        var origin = window.location.origin
        var ld = document.createElement('script')
        ld.type = 'application/ld+json'
        ld.text = JSON.stringify({
          '@context': 'https://schema.org',
          '@graph': [
            { '@type': 'Organization', name: 'FyndMyTrip', url: origin, logo: origin + '/logo.png' },
            {
              '@type': 'WebSite',
              name: 'FyndMyTrip',
              url: origin,
              potentialAction: {
                '@type': 'SearchAction',
                target: origin + '/packages?q={search_term_string}',
                'query-input': 'required name=search_term_string',
              },
            },
          ],
        })
        document.head.appendChild(ld)
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-bf423b9c.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-FKMQ4pEu.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
